<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phone Store - Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold mb-0">Quản Lý Đơn Hàng</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addInvoiceModal">
            Thêm mới đơn hàng
        </button>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white fw-bold">Sort & Search</div>
        <div class="card-body">
            <form th:action="@{/invoices/search-pagination}" method="get" class="row g-3">
                <div class="col-md-9">
                    <label class="form-label fw-semibold">Keyword (Tên KH / Trạng thái)</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên khách hàng hoặc trạng thái">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-dark me-2 w-100">Search</button>
                    <a th:href="@{/invoices/search-pagination}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Khách hàng</th>
                    <th>Ngày tạo</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="invoice : ${invoicePage.content}">
                    <td th:text="${invoice.id}">1</td>
                    <td class="text-start fw-bold" th:text="${invoice.customer.name}">Nguyễn Văn A</td>
                    <td th:text="${#temporals.format(invoice.createdAt, 'dd-MM-yyyy HH:mm')}">01-11-2026</td>
                    <td th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')}">20,000,000</td>
                    <td>
                        <span th:class="${invoice.status == 'COMPLETED' ? 'badge bg-success' : (invoice.status == 'CANCELED' ? 'badge bg-danger' : 'badge bg-warning text-dark')}"
                              th:text="${invoice.status}">PENDING</span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm"
                                th:data-id="${invoice.id}"
                                th:data-status="${invoice.status}"
                                onclick="showEditModal(this)">Update Status</button>
                    </td>
                </tr>

                <tr th:if="${invoicePage.totalElements == 0}">
                    <td colspan="6" class="text-muted py-4">Không tìm thấy đơn hàng nào!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${invoicePage.totalPages > 1}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${invoicePage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/invoices/search-pagination(page=${invoicePage.number - 1}, keyword=${keyword})}">Previous</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, invoicePage.totalPages - 1)}"
                th:classappend="${i == invoicePage.number} ? 'active'">
                <a class="page-link" th:href="@{/invoices/search-pagination(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${invoicePage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/invoices/search-pagination(page=${invoicePage.number + 1}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<div class="modal fade" id="addInvoiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/invoices/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Thêm mới đơn hàng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Khách hàng</label>
                        <select class="form-select" name="customerId" required>
                            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name} + ' - ' + ${c.phone}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Sản phẩm</label>
                        <select class="form-select" name="productId" required>
                            <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name} + ' (Tồn: ' + ${p.stock} + ')'"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số lượng</label>
                        <input type="number" class="form-control" name="quantity" min="1" value="1" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="invoiceEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Cập nhật trạng thái đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Trạng thái mới</label>
                        <select class="form-select" id="editStatus" name="status">
                            <option value="PENDING">PENDING</option>
                            <option value="CONFIRMED">CONFIRMED</option>
                            <option value="SHIP">SHIP</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="CANCELED">CANCELED</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-warning">Save changed</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showEditModal(button) {
        let id = button.getAttribute("data-id");
        let status = button.getAttribute("data-status");

        document.getElementById("editStatus").value = status;
        document.getElementById("editForm").action = "/invoices/update-status/" + id;

        let editModal = new bootstrap.Modal(document.getElementById('invoiceEditModal'));
        editModal.show();
    }
</script>

</body>
</html>
