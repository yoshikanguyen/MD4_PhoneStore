<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phone Store - Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <h2 class="mb-4 text-success fw-bold">👥 Quản Lý Khách Hàng</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 text-center align-middle">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="customer : ${customerPage.content}">
                    <td th:text="${customer.id}">1</td>
                    <td class="text-start fw-bold" th:text="${customer.name}">Nguyễn Văn A</td>
                    <td th:text="${customer.phone}">0987654321</td>
                    <td th:text="${customer.email}">a@gmail.com</td>
                    <td class="text-start" th:text="${customer.address}">Hà Nội</td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm me-1"
                                th:data-id="${customer.id}"
                                th:data-name="${customer.name}"
                                th:data-phone="${customer.phone}"
                                th:data-email="${customer.email}"
                                th:data-address="${customer.address}"
                                onclick="showEditModal(this)">Update</button>
                        <a th:href="@{'/customers/delete/' + ${customer.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này?')">Delete</a>
                    </td>
                </tr>

                <tr th:if="${customerPage.totalElements == 0}">
                    <td colspan="6" class="text-muted py-4">Chưa có khách hàng nào trong hệ thống!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${customerPage.totalPages > 1}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${customerPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/customers(page=${customerPage.number - 1})}">Previous</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, customerPage.totalPages - 1)}"
                th:classappend="${i == customerPage.number} ? 'active'">
                <a class="page-link" th:href="@{/customers(page=${i})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${customerPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/customers(page=${customerPage.number + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<div class="modal fade" id="customerEditModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editForm" method="post">
                <!-- CSRF token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="editModalLabel">Chỉnh sửa thông tin khách hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ tên</label>
                        <input type="text" class="form-control" id="editName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input type="text" class="form-control" id="editPhone" name="phone" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="editEmail" name="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Địa chỉ</label>
                        <input type="text" class="form-control" id="editAddress" name="address">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-success">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showEditModal(button) {
        let id = button.getAttribute("data-id");
        let name = button.getAttribute("data-name");
        let phone = button.getAttribute("data-phone");
        let email = button.getAttribute("data-email");
        let address = button.getAttribute("data-address");

        document.getElementById("editId").value = id;
        document.getElementById("editName").value = name;
        document.getElementById("editPhone").value = phone;
        document.getElementById("editEmail").value = email;
        document.getElementById("editAddress").value = address;

        document.getElementById("editForm").action = "/customers/update/" + id;

        let editModal = new bootstrap.Modal(document.getElementById('customerEditModal'));
        editModal.show();
    }
</script>

</body>
</html>
