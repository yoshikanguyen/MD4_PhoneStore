<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phone Store - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold mb-0">Quản Lý Sản Phẩm</h2>

        <form th:action="@{/logout}" method="post" class="d-inline mb-0">
            <button type="submit" class="btn btn-danger btn-sm">Logout</button>
        </form>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white fw-bold">Sort & Search</div>
        <div class="card-body">
            <form th:action="@{/products/search-pagination}" method="get" class="row g-3">
                <!-- CSRF token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Keyword (Tên/Hãng)</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên hoặc hãng">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Min price</label>
                    <input type="number" name="minPrice" th:value="${minPrice}" class="form-control" placeholder="Giá tối thiểu">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Max price</label>
                    <input type="number" name="maxPrice" th:value="${maxPrice}" class="form-control" placeholder="Giá tối đa">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">In stock</label>
                    <input type="number" name="stock" th:value="${stock}" class="form-control" placeholder="Số lượng tồn kho">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary me-2 w-100">Search</button>
                    <a th:href="@{/products/search-pagination}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Hãng</th>
                    <th>Giá</th>
                    <th>Tồn kho</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${productPage.content}">
                    <td th:text="${product.id}">1</td>
                    <td class="text-start fw-bold" th:text="${product.name}">Tên sản phẩm</td>
                    <td th:text="${product.brand}">Hãng</td>
                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">Giá</td>
                    <td>
            <span th:class="${product.stock > 0 ? 'badge bg-success' : 'badge bg-danger'}"
                  th:text="${product.stock}">10</span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm me-1"
                                th:data-id="${product.id}"
                                th:data-name="${product.name}"
                                th:data-brand="${product.brand}"
                                th:data-price="${product.price}"
                                th:data-stock="${product.stock}"
                                onclick="showEditModal(this)">Update</button>
                        <a th:href="@{'/products/delete/' + ${product.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">Delete</a>
                    </td>
                </tr>

                <tr th:if="${productPage.totalElements == 0}">
                    <td colspan="6" class="text-muted py-4">Không tìm thấy sản phẩm nào!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${productPage.totalPages > 1}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products/search-pagination(page=${productPage.number - 1}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice}, stock=${stock})}">Previous</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                th:classappend="${i == productPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/products/search-pagination(page=${i}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice}, stock=${stock})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products/search-pagination(page=${productPage.number + 1}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice}, stock=${stock})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<script>
    function showEditModal(button) {
        let id = button.getAttribute("data-id");
        let name = button.getAttribute("data-name");
        let brand = button.getAttribute("data-brand");
        let price = button.getAttribute("data-price");
        let stock = button.getAttribute("data-stock");

        document.getElementById("editId").value = id;
        document.getElementById("editName").value = name;
        document.getElementById("editBrand").value = brand;
        document.getElementById("editPrice").value = price;
        document.getElementById("editStock").value = stock;

        document.getElementById("editForm").action = "/products/update/" + id;

        let editModal = new bootstrap.Modal(document.getElementById('productEditModal'));
        editModal.show();
    }
</script>

</body>
</html>
